name: E2E Tests

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.vscode/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  # Runs dependency lifecycle scripts and builds. No OIDC permission, no environment, no secrets.
  build:
    name: Build VSIX
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Compile webpack bundles
        run: npm run compile:webpack

      - name: Compile E2E tests
        run: npm run compile:e2e

      - name: Package VSIX
        run: npm run package

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-build-${{ matrix.os }}
          path: |
            kusto-notebooks.vsix
            out/
          retention-days: 1

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kusto-notebooks-vsix-${{ matrix.os }}
          path: kusto-notebooks.vsix
          retention-days: 7

  # Only job with OIDC access. Installs with lifecycle scripts disabled and runs prebuilt artifacts.
  e2e-tests:
    name: E2E VSIX Tests
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: build
    permissions:
      checks: write
      pull-requests: write
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build-${{ matrix.os }}

      - name: Prepare pinned VS Code
        id: prepare_vscode
        run: node ./out/tests/e2e/prepareVSCode.js
        env:
          VSCODE_VERSION: 1.97.0

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.APP_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run E2E VSIX tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node ./out/tests/e2e/runVSIXTests.js
        env:
          DISPLAY: ':99.0'
          E2E_TEST_LEVEL: all
          VSIX_PATH: ${{ github.workspace }}/kusto-notebooks.vsix
          VSCODE_EXECUTABLE_PATH: ${{ steps.prepare_vscode.outputs.path }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
          KUSTO_TEST_CLUSTER: ${{ secrets.CLUSTER }}
          KUSTO_TEST_DATABASE: ${{ secrets.DATABASE }}

      - name: Run E2E VSIX tests (macOS)
        if: runner.os == 'macOS'
        run: node ./out/tests/e2e/runVSIXTests.js
        env:
          E2E_TEST_LEVEL: all
          VSIX_PATH: ${{ github.workspace }}/kusto-notebooks.vsix
          VSCODE_EXECUTABLE_PATH: ${{ steps.prepare_vscode.outputs.path }}
          AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
          KUSTO_TEST_CLUSTER: ${{ secrets.CLUSTER }}
          KUSTO_TEST_DATABASE: ${{ secrets.DATABASE }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            out/tests/
            *.log
          retention-days: 7
